<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เกมให้อาหารฮิปโป</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #e0f7fa; }
        #gameCanvas { background: #80deea; border: 4px solid #00838f; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🦛 เกมให้อาหารฮิปโป 🦛</h1>
    <p>คลิกที่หน้าจอเพื่อโยนอาหารให้ฮิปโปอ้าปากรับ!</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <h2>คะแนน: <span id="score">0</span></h2>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let foods = [];
        let hippoMouthOpen = false;

        // สลับการอ้าปากของฮิปโปทุกๆ 1.5 วินาที
        setInterval(() => { hippoMouthOpen = !hippoMouthOpen; }, 1500);

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            foods.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, radius: 8 });
        });

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // วาดบ่อน้ำ
            ctx.fillStyle = '#4dd0e1';
            ctx.fillRect(0, 200, 600, 200);

            // วาดฮิปโป
            ctx.fillStyle = '#a1887f';
            ctx.beginPath();
            ctx.arc(100, 300, 60, 0, Math.PI * 2); // หัว
            ctx.fill();

            // ปากฮิปโป
            ctx.fillStyle = hippoMouthOpen ? '#d32f2f' : '#8d6e63';
            ctx.beginPath();
            if (hippoMouthOpen) {
                ctx.arc(130, 300, 30, 0, Math.PI * 2); // ปากอ้า
            } else {
                ctx.arc(130, 310, 15, 0, Math.PI * 2); // ปากหุบ
            }
            ctx.fill();

            // วาดและอัปเดตอาหาร
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.y += 3; // อาหารตกตามแรงโน้มถ่วง
                f.x -= 2; // ลอยเข้าหาฮิปโป

                ctx.fillStyle = '#81c784';
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();

                // ตรวจจับการกินอาหาร
                if (hippoMouthOpen && Math.hypot(f.x - 130, f.y - 300) < 35) {
                    score += 10;
                    document.getElementById('score').innerText = score;
                    foods.splice(i, 1);
                } else if (f.y > canvas.height) {
                    foods.splice(i, 1); // ลบเมื่อตกน้ำ
                }
            }
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
